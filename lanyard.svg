<svg width="300" height="500" viewBox="0 0 300 500" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Fira+Code&amp;display=swap');
      .strap-text { font-family: 'Orbitron', sans-serif; font-size: 20px; fill: #00F0FF; text-anchor: middle; letter-spacing: 2px;}
      .badge-title { font-family: 'Orbitron', sans-serif; font-size: 24px; fill: #FFFFFF; font-weight: bold; text-anchor: middle; }
      .badge-sub { font-family: 'Fira+Code', monospace; font-size: 12px; fill: #38BDF8; font-weight: bold; text-anchor: middle; }
    </style>
    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>
    <clipPath id="avatarClip">
      <circle cx="100" cy="110" r="50"/>
    </clipPath>
    <filter id="neonBlue">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g id="lanyardAssembly" transform-origin="150 0">
    <animateTransform attributeName="transform" type="translate" from="0,-500" to="0,0" dur="1s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1" />
    <animateTransform attributeName="transform" type="rotate" values="0; 15; -10; 8; -4; 1; 0" dur="2.5s" begin="1s" fill="freeze" calcMode="spline" keySplines="0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1; 0.4 0 0.2 1" additive="sum"/>
    <animateTransform attributeName="transform" type="rotate" values="0.5; -0.5; 0.5" dur="4s" begin="3.5s" repeatCount="indefinite" additive="sum"/>

    <!-- Lanyard Strap -->
    <path d="M135 0 L165 0 L155 300 H145 Z" fill="#0F172A"/>
    <text x="150" y="150" transform="rotate(-90 150 150)" class="strap-text">SYSADMIN</text>

    <!-- Metal Clasp -->
    <circle cx="150" cy="300" r="10" fill="none" stroke="#94A3B8" stroke-width="3"/>
    <rect x="135" y="310" width="30" height="15" rx="2" fill="#64748B"/>

    <!-- ID Card -->
    <g id="idCard" transform="translate(50, 325)">
      <rect width="200" height="280" rx="10" fill="url(#badgeGrad)" stroke="#00F0FF" stroke-width="2" filter="url(#neonBlue)"/>
      <rect x="10" y="10" width="180" height="260" rx="5" fill="none" stroke="#334155" stroke-width="1"/>

      <!-- IMPORTANT: AVATAR IMAGE CODE GOES HERE -->
      <g>
        <circle cx="100" cy="110" r="52" fill="none" stroke="#00F0FF" stroke-width="3"/>
        <image x="50" y="60" width="100" height="100" clip-path="url(#avatarClip)" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" />
      </g>

      <g transform="translate(100, 190)">
        <text x="0" y="0" class="badge-title">M. FADHIL</text>
        <text x="0" y="25" class="badge-sub">ID: DEV-2026-X</text>
        <text x="0" y="45" class="badge-sub">ACCESS: ROOT</text>
      </g>
      
      <!-- Holographic Shine -->
      <rect id="shine" x="-50" y="0" width="100" height="280" rx="10" fill="none" opacity="0">
        <fill>
          <linearGradient id="shineGradient" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0" stop-color="#00F0FF" stop-opacity="0"/>
            <stop offset="0.5" stop-color="#00F0FF" stop-opacity="0.2"/>
            <stop offset="1" stop-color="#00F0FF" stop-opacity="0"/>
          </linearGradient>
        </fill>
        <animate attributeName="x" from="-100" to="200" dur="3s" begin="2s" repeatCount="indefinite" />
        <animate attributeName="opacity" values="0; 1; 1; 0" dur="3s" begin="2s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>
</svg>
