<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" fill="none">
  <defs>
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#6d28d9" />
      <stop offset="50%" style="stop-color:#7c3aed" />
      <stop offset="100%" style="stop-color:#6d28d9" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#12102e" />
      <stop offset="100%" style="stop-color:#0d0b20" />
    </linearGradient>
    <linearGradient id="shineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:transparent" />
      <stop offset="40%" style="stop-color:transparent" />
      <stop offset="50%" style="stop-color:rgba(255,255,255,0.12)" />
      <stop offset="60%" style="stop-color:transparent" />
      <stop offset="100%" style="stop-color:transparent" />
    </linearGradient>
    <linearGradient id="avatarRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7" />
      <stop offset="50%" style="stop-color:#f59e0b" />
      <stop offset="100%" style="stop-color:#a855f7" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d1d5db" />
      <stop offset="50%" style="stop-color:#9ca3af" />
      <stop offset="100%" style="stop-color:#6b7280" />
    </linearGradient>
    <filter id="cardGlow">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="avatarGlow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <clipPath id="cardClip">
      <rect x="60" y="200" width="280" height="350" rx="12" />
    </clipPath>
  </defs>

  <style>
    @keyframes swingDamped {
      0% { transform: rotate(-18deg); }
      5% { transform: rotate(14deg); }
      10% { transform: rotate(-10deg); }
      15% { transform: rotate(7deg); }
      20% { transform: rotate(-5deg); }
      25% { transform: rotate(3deg); }
      30% { transform: rotate(-2deg); }
      35%, 50% { transform: rotate(0deg); }
      55% { transform: rotate(2.5deg); }
      65% { transform: rotate(-2.5deg); }
      75% { transform: rotate(2deg); }
      85% { transform: rotate(-2deg); }
      95% { transform: rotate(1.5deg); }
      100% { transform: rotate(-1.5deg); }
    }
    @keyframes gentleSway {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }
    @keyframes dropIn {
      from { transform: translateY(-120px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes holoSweep {
      0% { transform: translateX(-300px); }
      100% { transform: translateX(400px); }
    }
    @keyframes avatarPulse {
      0%, 100% { opacity: 0.7; }
      50% { opacity: 1; }
    }
    @keyframes borderGlow {
      0%, 100% { opacity: 0.3; }
      50% { opacity: 0.6; }
    }

    .badge-wrapper {
      transform-origin: 200px 0px;
      animation: dropIn 0.6s ease-out both, swingDamped 6s ease-in-out 0.6s both;
    }
    .badge-sway {
      transform-origin: 200px 0px;
      animation: gentleSway 4s ease-in-out 6.6s infinite;
    }
    .holo-shine {
      animation: holoSweep 5s ease-in-out 2s infinite;
    }
    .avatar-ring {
      animation: avatarPulse 3s ease-in-out infinite;
    }
    .card-border {
      animation: borderGlow 4s ease-in-out infinite;
    }
  </style>

  <g class="badge-wrapper">
    <g class="badge-sway">

      <!-- LANYARD STRAP -->
      <rect x="182" y="0" width="36" height="160" fill="url(#strapGrad)" rx="2" />
      <!-- Strap edge highlights -->
      <rect x="182" y="0" width="2" height="160" fill="#8b5cf6" opacity="0.3" />
      <rect x="216" y="0" width="2" height="160" fill="#5b21b6" opacity="0.3" />
      <!-- Strap text - DEVELOPER -->
      <text x="200" y="80" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="11" font-weight="700" fill="#a78bfa" letter-spacing="4" transform="rotate(90, 200, 80)" opacity="0.5">DEVELOPER</text>

      <!-- METAL CLASP -->
      <rect x="185" y="140" width="30" height="18" rx="3" fill="url(#metalGrad)" />
      <rect x="187" y="142" width="26" height="2" fill="#e5e7eb" opacity="0.5" />
      <!-- Clasp pin -->
      <rect x="196" y="156" width="8" height="8" rx="1" fill="#9ca3af" />

      <!-- METAL RING -->
      <circle cx="200" cy="178" r="12" fill="none" stroke="url(#metalGrad)" stroke-width="3" />
      <circle cx="200" cy="178" r="12" fill="none" stroke="#e5e7eb" stroke-width="1" opacity="0.3" />
      <!-- Ring connector to card -->
      <line x1="200" y1="190" x2="200" y2="202" stroke="#9ca3af" stroke-width="2" />

      <!-- ID CARD -->
      <g filter="url(#cardGlow)">
        <rect class="card-border" x="60" y="200" width="280" height="350" rx="12" fill="url(#cardGrad)" stroke="#a855f7" stroke-width="1.5" />
      </g>

      <!-- HOLOGRAPHIC SHINE SWEEP (clipped to card) -->
      <g clip-path="url(#cardClip)">
        <rect class="holo-shine" x="60" y="200" width="200" height="350" fill="url(#shineGrad)" />
      </g>

      <!-- AVATAR CIRCLE -->
      <g filter="url(#avatarGlow)">
        <circle class="avatar-ring" cx="200" cy="275" r="48" fill="none" stroke="url(#avatarRing)" stroke-width="3" />
      </g>
      <circle cx="200" cy="275" r="44" fill="#1a1735" />
      <!-- Stylized avatar silhouette -->
      <circle cx="200" cy="263" r="14" fill="#8b8ba7" opacity="0.6" /> <!-- Head -->
      <ellipse cx="200" cy="295" rx="20" ry="15" fill="#8b8ba7" opacity="0.4" /> <!-- Body -->
      <!-- Code brackets overlay on avatar -->
      <text x="200" y="280" text-anchor="middle" font-family="'Consolas', monospace" font-size="28" fill="#f59e0b" opacity="0.4">&lt;/&gt;</text>

      <!-- NAME -->
      <text x="200" y="350" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="22" font-weight="700" fill="#f0eef6">Muhammed Fadhil</text>

      <!-- ROLE -->
      <text x="200" y="375" text-anchor="middle" font-family="'Segoe UI', system-ui, sans-serif" font-size="14" font-weight="600" fill="#f59e0b">Full-Stack Developer</text>

      <!-- HANDLE -->
      <text x="200" y="398" text-anchor="middle" font-family="'Consolas', 'Courier New', monospace" font-size="12" fill="#8b8ba7">@fadhil-maker</text>

      <!-- SEPARATOR -->
      <rect x="120" y="415" width="160" height="1.5" rx="1" fill="#f59e0b" opacity="0.5" />

      <!-- BARCODE -->
      <g transform="translate(120, 430)">
        <!-- Barcode lines of varying widths -->
        <rect x="0" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="5" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="8" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="13" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="16" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="20" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="23" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="28" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="32" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="35" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="39" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="44" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="47" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="51" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="54" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="59" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="63" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="66" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="70" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="75" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="78" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="82" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="85" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="90" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="94" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="97" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="101" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="106" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="109" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="113" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="118" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="121" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="125" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="128" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="133" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="137" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="140" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="144" y="0" width="3" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="149" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="152" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="156" y="0" width="1" height="30" fill="#7c3aed" opacity="0.6" />
        <rect x="159" y="0" width="2" height="30" fill="#7c3aed" opacity="0.6" />
      </g>
      <!-- Barcode ID text -->
      <text x="200" y="478" text-anchor="middle" font-family="'Consolas', monospace" font-size="10" fill="#8b8ba7" letter-spacing="2">ID: 2024-FDEV-001</text>

      <!-- Small amber accent dots at bottom of card -->
      <circle cx="170" cy="530" r="2" fill="#f59e0b" opacity="0.4" />
      <circle cx="200" cy="530" r="2" fill="#a855f7" opacity="0.4" />
      <circle cx="230" cy="530" r="2" fill="#f59e0b" opacity="0.4" />

    </g>
  </g>
</svg>
