<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" fill="none">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap');

    /* ===== Card entrance ===== */
    @keyframes cardFadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .card { animation: cardFadeIn 0.6s ease both; }

    /* ===== Title shimmer ===== */
    @keyframes titleGlow {
      0%, 100% { opacity: 0.85; }
      50%      { opacity: 1; }
    }
    .title { animation: titleGlow 3s ease-in-out infinite; }

    /* ===== Stacked bar segments grow ===== */
    @keyframes growStack1 { from { width: 0; } to { width: 136px; } }
    @keyframes growStack2 { from { width: 0; } to { width: 85px; } }
    @keyframes growStack3 { from { width: 0; } to { width: 68px; } }
    @keyframes growStack4 { from { width: 0; } to { width: 34px; } }
    @keyframes growStack5 { from { width: 0; } to { width: 17px; } }

    .stack-seg-1 { width: 0; animation: growStack1 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.3s both; }
    .stack-seg-2 { width: 0; animation: growStack2 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.45s both; }
    .stack-seg-3 { width: 0; animation: growStack3 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.6s both; }
    .stack-seg-4 { width: 0; animation: growStack4 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.75s both; }
    .stack-seg-5 { width: 0; animation: growStack5 0.8s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.9s both; }

    /* ===== Individual bar growth ===== */
    @keyframes growBar1 { from { width: 0; } to { width: 200px; } }
    @keyframes growBar2 { from { width: 0; } to { width: 125px; } }
    @keyframes growBar3 { from { width: 0; } to { width: 100px; } }
    @keyframes growBar4 { from { width: 0; } to { width: 50px; } }
    @keyframes growBar5 { from { width: 0; } to { width: 25px; } }

    .bar-1 { width: 0; animation: growBar1 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.5s both; }
    .bar-2 { width: 0; animation: growBar2 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.65s both; }
    .bar-3 { width: 0; animation: growBar3 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.8s both; }
    .bar-4 { width: 0; animation: growBar4 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 0.95s both; }
    .bar-5 { width: 0; animation: growBar5 0.7s cubic-bezier(0.25, 0.46, 0.45, 0.94) 1.1s both; }

    /* ===== Row fade-in ===== */
    @keyframes rowFade {
      from { opacity: 0; transform: translateX(-10px); }
      to   { opacity: 1; transform: translateX(0); }
    }
    .lang-row { opacity: 0; }
    .lang-row-1 { animation: rowFade 0.4s ease 0.4s both; }
    .lang-row-2 { animation: rowFade 0.4s ease 0.55s both; }
    .lang-row-3 { animation: rowFade 0.4s ease 0.7s both; }
    .lang-row-4 { animation: rowFade 0.4s ease 0.85s both; }
    .lang-row-5 { animation: rowFade 0.4s ease 1.0s both; }

    /* ===== Percentage pop ===== */
    @keyframes pctPop {
      0%   { opacity: 0; transform: scale(0.7); }
      60%  { transform: scale(1.08); }
      100% { opacity: 1; transform: scale(1); }
    }
    .pct-1 { opacity: 0; animation: pctPop 0.35s ease 1.2s both; }
    .pct-2 { opacity: 0; animation: pctPop 0.35s ease 1.35s both; }
    .pct-3 { opacity: 0; animation: pctPop 0.35s ease 1.5s both; }
    .pct-4 { opacity: 0; animation: pctPop 0.35s ease 1.65s both; }
    .pct-5 { opacity: 0; animation: pctPop 0.35s ease 1.8s both; }

    text { font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif; }
  </style>

  <defs>
    <linearGradient id="cardBg" x1="0" y1="0" x2="400" y2="200" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#12102e"/>
      <stop offset="100%" stop-color="#0d0b20"/>
    </linearGradient>
    <radialGradient id="innerGlow" cx="0.2" cy="0.1" r="0.9">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="transparent" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="stackClip">
      <rect x="30" y="42" width="340" height="10" rx="5"/>
    </clipPath>
  </defs>

  <g class="card">
    <!-- Background -->
    <rect x="0.5" y="0.5" width="399" height="199" rx="12" ry="12"
          fill="url(#cardBg)" stroke="#7c3aed" stroke-opacity="0.3" stroke-width="1"/>
    <rect x="1" y="1" width="398" height="198" rx="12" ry="12" fill="url(#innerGlow)"/>

    <!-- Title -->
    <text class="title" x="20" y="30" fill="#f59e0b" font-size="14" font-weight="700"
          letter-spacing="0.3">Most Used Languages</text>

    <!-- ===== Combined Stacked Bar ===== -->
    <g clip-path="url(#stackClip)">
      <!-- Track -->
      <rect x="30" y="42" width="340" height="10" rx="5" fill="#1a1740"/>
      <!-- Python 40% = 136px -->
      <rect class="stack-seg-1" x="30"  y="42" height="10" fill="#f59e0b" rx="5"/>
      <!-- HTML 25% = 85px -->
      <rect class="stack-seg-2" x="166" y="42" height="10" fill="#a855f7"/>
      <!-- JS 20% = 68px -->
      <rect class="stack-seg-3" x="251" y="42" height="10" fill="#22c55e"/>
      <!-- CSS 10% = 34px -->
      <rect class="stack-seg-4" x="319" y="42" height="10" fill="#ec4899"/>
      <!-- Other 5% = 17px -->
      <rect class="stack-seg-5" x="353" y="42" height="10" rx="5" fill="#6b7280"/>
    </g>

    <!-- ===== Individual Language Bars ===== -->

    <!-- Python -->
    <g transform="translate(0, 72)">
      <g class="lang-row lang-row-1">
        <circle cx="30" cy="6" r="4" fill="#f59e0b"/>
        <text x="40" y="10" fill="#f0eef6" font-size="11.5" font-weight="600">Python</text>
        <rect class="bar-1" x="120" y="0" height="12" rx="4" fill="#f59e0b" fill-opacity="0.85"/>
        <text class="pct-1" x="328" y="10" fill="#8b8ba7" font-size="11" font-weight="600" text-anchor="end">40.00%</text>
      </g>
    </g>

    <!-- HTML -->
    <g transform="translate(0, 97)">
      <g class="lang-row lang-row-2">
        <circle cx="30" cy="6" r="4" fill="#a855f7"/>
        <text x="40" y="10" fill="#f0eef6" font-size="11.5" font-weight="600">HTML</text>
        <rect class="bar-2" x="120" y="0" height="12" rx="4" fill="#a855f7" fill-opacity="0.85"/>
        <text class="pct-2" x="328" y="10" fill="#8b8ba7" font-size="11" font-weight="600" text-anchor="end">25.00%</text>
      </g>
    </g>

    <!-- JavaScript -->
    <g transform="translate(0, 122)">
      <g class="lang-row lang-row-3">
        <circle cx="30" cy="6" r="4" fill="#22c55e"/>
        <text x="40" y="10" fill="#f0eef6" font-size="11.5" font-weight="600">JavaScript</text>
        <rect class="bar-3" x="120" y="0" height="12" rx="4" fill="#22c55e" fill-opacity="0.85"/>
        <text class="pct-3" x="328" y="10" fill="#8b8ba7" font-size="11" font-weight="600" text-anchor="end">20.00%</text>
      </g>
    </g>

    <!-- CSS -->
    <g transform="translate(0, 147)">
      <g class="lang-row lang-row-4">
        <circle cx="30" cy="6" r="4" fill="#ec4899"/>
        <text x="40" y="10" fill="#f0eef6" font-size="11.5" font-weight="600">CSS</text>
        <rect class="bar-4" x="120" y="0" height="12" rx="4" fill="#ec4899" fill-opacity="0.85"/>
        <text class="pct-4" x="328" y="10" fill="#8b8ba7" font-size="11" font-weight="600" text-anchor="end">10.00%</text>
      </g>
    </g>

    <!-- Other -->
    <g transform="translate(0, 172)">
      <g class="lang-row lang-row-5">
        <circle cx="30" cy="6" r="4" fill="#6b7280"/>
        <text x="40" y="10" fill="#f0eef6" font-size="11.5" font-weight="600">Other</text>
        <rect class="bar-5" x="120" y="0" height="12" rx="4" fill="#6b7280" fill-opacity="0.85"/>
        <text class="pct-5" x="328" y="10" fill="#8b8ba7" font-size="11" font-weight="600" text-anchor="end">5.00%</text>
      </g>
    </g>

    <!-- Footer -->
    <text x="20" y="195" fill="#8b8ba7" font-size="8.5" font-weight="400" opacity="0.5">@fadhil-maker</text>
  </g>
</svg>
