<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 282" width="420" height="282" role="img" aria-label="Top languages">
<defs><style><![CDATA[

text{font-family:'Segoe UI', system-ui, sans-serif}
.title{font-family:'Orbitron', 'Segoe UI', sans-serif}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shineX{0%{transform:translateX(-140px)}60%,100%{transform:translateX(460px)}}
.row{opacity:0;animation:fadeUp .5s ease forwards}
.sh{animation:shineX 4s ease-in-out 2.2s infinite}
]]></style>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0">
  <stop offset="0%"><animate attributeName="stop-color" values="#06b6d4;#3b82f6;#0284c7;#06b6d4" dur="6s" repeatCount="indefinite"/></stop>
  <stop offset="100%"><animate attributeName="stop-color" values="#0284c7;#06b6d4;#3b82f6;#0284c7" dur="6s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="shg" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#fff" stop-opacity="0"/><stop offset="50%" stop-color="#fff" stop-opacity=".08"/><stop offset="100%" stop-color="#fff" stop-opacity="0"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
  <stop offset="0%" stop-color="#0f172a"/><stop offset="100%" stop-color="#020617"/>
</linearGradient>

<clipPath id="cardc"><rect x="1" y="1" width="418" height="280" rx="14"/></clipPath>
<clipPath id="stackc"><rect x="20" y="58" width="0" height="11" rx="5.5"><animate attributeName="width" from="0" to="380" dur="1.4s" begin=".4s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/></rect></clipPath>
<filter id="glow"><feGaussianBlur stdDeviation="2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>

<!-- Background -->
<rect x="1" y="1" width="418" height="280" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>

<!-- Title -->
<text class="title" x="20" y="34" font-size="16" font-weight="bold" fill="#f8fafc">Top Languages</text>
<text class="title" x="20" y="34" font-size="16" font-weight="bold" fill="url(#tg)" filter="url(#glow)">Top Languages</text>

<!-- Top Bar -->
<g clip-path="url(#stackc)">
  <rect x="20.0" y="58" width="304.0" height="11" fill="#e34c26"/>
  <rect x="324.0" y="58" width="76.0" height="11" fill="#3b82f6"/>
  <rect x="400.0" y="58" width="0.0" height="11" fill="#0ea5e9"/>
  <rect x="400.0" y="58" width="0.0" height="11" fill="#0ea5e9"/>
</g>

  <!-- Lang 1 -->
  <g class="row" style="animation-delay:0.90s">
    <circle cx="26" cy="91" r="5" fill="#e34c26" filter="url(#glow)"/>
    <circle cx="26" cy="91" r="5" fill="#e34c26"/>
    <text x="40" y="96" font-size="13" fill="#e2e8f0" font-weight="bold">HTML</text>
    <text x="396" y="96" text-anchor="end" font-size="13" fill="#e34c26" font-weight="bold">80.0%</text>
    <rect x="40" y="104" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="104" width="214.4" height="9" rx="4.5" fill="#e34c26" style="animation-delay:1.05s">
      <animate attributeName="width" from="0" to="214.4" dur="1.1s" begin="1.05s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Lang 2 -->
  <g class="row" style="animation-delay:1.25s">
    <circle cx="26" cy="133" r="5" fill="#3b82f6" filter="url(#glow)"/>
    <circle cx="26" cy="133" r="5" fill="#3b82f6"/>
    <text x="40" y="138" font-size="13" fill="#e2e8f0" font-weight="bold">Python</text>
    <text x="396" y="138" text-anchor="end" font-size="13" fill="#3b82f6" font-weight="bold">20.0%</text>
    <rect x="40" y="146" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="146" width="53.6" height="9" rx="4.5" fill="#3b82f6" style="animation-delay:1.40s">
      <animate attributeName="width" from="0" to="53.6" dur="1.1s" begin="1.40s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Lang 3 -->
  <g class="row" style="animation-delay:1.60s">
    <circle cx="26" cy="175" r="5" fill="#0ea5e9" filter="url(#glow)"/>
    <circle cx="26" cy="175" r="5" fill="#0ea5e9"/>
    <text x="40" y="180" font-size="13" fill="#e2e8f0" font-weight="bold">Other</text>
    <text x="396" y="180" text-anchor="end" font-size="13" fill="#0ea5e9" font-weight="bold">0.0%</text>
    <rect x="40" y="188" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="188" width="0.0" height="9" rx="4.5" fill="#0ea5e9" style="animation-delay:1.75s">
      <animate attributeName="width" from="0" to="0.0" dur="1.1s" begin="1.75s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

  <!-- Lang 4 -->
  <g class="row" style="animation-delay:1.95s">
    <circle cx="26" cy="217" r="5" fill="#0ea5e9" filter="url(#glow)"/>
    <circle cx="26" cy="217" r="5" fill="#0ea5e9"/>
    <text x="40" y="222" font-size="13" fill="#e2e8f0" font-weight="bold">Other</text>
    <text x="396" y="222" text-anchor="end" font-size="13" fill="#0ea5e9" font-weight="bold">0.0%</text>
    <rect x="40" y="230" width="268" height="9" rx="4.5" fill="#1e293b"/>
    <rect class="bar" x="40" y="230" width="0.0" height="9" rx="4.5" fill="#0ea5e9" style="animation-delay:2.10s">
      <animate attributeName="width" from="0" to="0.0" dur="1.1s" begin="2.10s" fill="freeze" calcMode="spline" keySplines=".2 .8 .3 1"/>
    </rect>
  </g>

<g clip-path="url(#cardc)"><rect class="sh" x="0" y="0" width="100" height="282" fill="url(#shg)" transform="skewX(-15)"/></g>
</svg>
