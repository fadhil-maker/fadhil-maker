<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f0c29" />
      <stop offset="50%" style="stop-color:#302b63" />
      <stop offset="100%" style="stop-color:#0d0b20" />
    </linearGradient>

    <!-- Glow Effects -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="glowHeavy" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.4"/>
    </filter>

    <!-- Frame Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a855f7" />
      <stop offset="100%" style="stop-color:#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1100" height="700" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle grid pattern overlay -->
  <g opacity="0.05" stroke="#ffffff" stroke-width="1">
    <path d="M0,50 L1100,50 M0,100 L1100,100 M0,150 L1100,150 M0,200 L1100,200 M0,250 L1100,250 M0,300 L1100,300 M0,350 L1100,350 M0,400 L1100,400 M0,450 L1100,450 M0,500 L1100,500 M0,550 L1100,550 M0,600 L1100,600 M0,650 L1100,650" />
    <path d="M50,0 L50,700 M100,0 L100,700 M150,0 L150,700 M200,0 L200,700 M250,0 L250,700 M300,0 L300,700 M350,0 L350,700 M400,0 L400,700 M450,0 L450,700 M500,0 L500,700 M550,0 L550,700 M600,0 L600,700 M650,0 L650,700 M700,0 L700,700 M750,0 L750,700 M800,0 L800,700 M850,0 L850,700 M900,0 L900,700 M950,0 L950,700 M1000,0 L1000,700 M1050,0 L1050,700" />
  </g>

  <!-- Outline frame -->
  <rect x="2" y="2" width="1096" height="696" rx="14" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Corner Brackets -->
  <path d="M 30,30 L 30,50 M 30,30 L 50,30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M 1070,30 L 1070,50 M 1070,30 L 1050,30" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M 30,670 L 30,650 M 30,670 L 50,670" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />
  <path d="M 1070,670 L 1070,650 M 1070,670 L 1050,670" stroke="#f59e0b" stroke-width="3" stroke-linecap="round" />

  <!-- Floating Sparkles -->
  <g opacity="0.8">
    <path d="M 450,150 L 452,157 L 459,159 L 452,161 L 450,168 L 448,161 L 441,159 L 448,157 Z" fill="#f59e0b" />
    <path d="M 750,250 L 752,257 L 759,259 L 752,261 L 750,268 L 748,261 L 741,259 L 748,257 Z" fill="#a855f7" />
    <circle cx="500" cy="400" r="3" fill="#ffffff" opacity="0.5" />
    <circle cx="650" cy="100" r="2" fill="#ffffff" opacity="0.3" />
    <circle cx="950" cy="450" r="4" fill="#f59e0b" opacity="0.4" />
  </g>

  <style>
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }
    @keyframes pulseText {
      0%, 100% { opacity: 0.8; }
      50% { opacity: 1; }
    }
    .float-card { animation: float 6s ease-in-out infinite; }
    .neon-text { animation: pulseText 4s infinite alternate; }
  </style>

  <!-- ================= LEFT COLUMN ================= -->
  <g transform="translate(40, 0)">
    
    <!-- Terminal Text -->
    <text x="0" y="80" font-family="'Consolas', monospace" font-size="14" fill="#10b981" font-weight="bold">
      user@dev-machine:~$ cat README.md
    </text>
    <rect x="255" y="68" width="8" height="14" fill="#10b981" />

    <!-- Greeting -->
    <text x="0" y="135" font-family="'Segoe UI', sans-serif" font-size="28" font-weight="bold" fill="#ffffff">Hi, I'm 👋</text>

    <!-- Name (Stylized Cursive-like) -->
    <g filter="url(#glow)">
      <text x="0" y="210" font-family="'Comic Sans MS', 'Brush Script MT', cursive, sans-serif" font-size="64" font-weight="bold" fill="#f59e0b">
        Muhammed Fadhil
      </text>
    </g>

    <!-- Role Tag -->
    <text x="0" y="260" font-family="'Consolas', monospace" font-size="20" font-weight="bold" fill="#a855f7">
      &lt; Full-Stack Developer /&gt;
    </text>

    <!-- Quote Box -->
    <rect x="0" y="290" width="400" height="70" rx="8" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
    <text x="20" y="325" font-family="'Segoe UI', sans-serif" font-size="15" fill="#e2e8f0" font-weight="500">I don't just write code,</text>
    <text x="20" y="345" font-family="'Segoe UI', sans-serif" font-size="15" fill="#f59e0b" font-weight="bold">I build scalable solutions.</text>
    
    <!-- Tech Section Header -->
    <text x="0" y="410" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">🧩 Tech I Know</text>

    <!-- Tech Pills Row 1 -->
    <g transform="translate(0, 425)">
      <rect x="0" y="0" width="75" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text x="37.5" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">Python</text>

      <rect x="85" y="0" width="75" height="28" rx="14" fill="none" stroke="#a855f7" stroke-width="1.5" />
      <text x="122.5" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a855f7">Django</text>

      <rect x="170" y="0" width="95" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text x="217.5" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">JavaScript</text>

      <rect x="275" y="0" width="70" height="28" rx="14" fill="none" stroke="#a855f7" stroke-width="1.5" />
      <text x="310" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a855f7">React</text>
    </g>

    <!-- Tech Pills Row 2 -->
    <g transform="translate(0, 465)">
      <rect x="0" y="0" width="60" height="28" rx="14" fill="none" stroke="#a855f7" stroke-width="1.5" />
      <text x="30" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a855f7">SQL</text>

      <rect x="70" y="0" width="100" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text x="120" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">PostgreSQL</text>

      <rect x="180" y="0" width="70" height="28" rx="14" fill="none" stroke="#a855f7" stroke-width="1.5" />
      <text x="215" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#a855f7">Docker</text>
      
      <rect x="260" y="0" width="100" height="28" rx="14" fill="none" stroke="#f59e0b" stroke-width="1.5" />
      <text x="310" y="19" text-anchor="middle" font-family="sans-serif" font-size="12" font-weight="bold" fill="#f59e0b">UI/UX Design</text>
    </g>

    <!-- About Me -->
    <text x="0" y="535" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" fill="#ffffff">💖 About Me</text>
    
    <text x="0" y="565" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#10b981">&gt;</text>
    <text x="15" y="565" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">I build responsive, user-friendly and impactful web experiences.</text>

    <text x="0" y="585" font-family="'Segoe UI', sans-serif" font-size="13" fill="#f59e0b">💡</text>
    <text x="18" y="585" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Always learning, always building.</text>

    <text x="0" y="605" font-family="'Segoe UI', sans-serif" font-size="13" fill="#a855f7">🚀</text>
    <text x="18" y="605" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="bold" fill="#e2e8f0">Turning ideas into real world solutions.</text>

    <!-- Stats Box -->
    <g transform="translate(0, 630)" filter="url(#softShadow)">
      <rect x="0" y="0" width="450" height="50" rx="12" fill="#15122e" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
      
      <!-- Repos -->
      <text x="25" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b8ba7">📦 Repos</text>
      <text x="45" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f0eef6">25+</text>
      
      <!-- Commits -->
      <text x="135" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b8ba7">🔨 Commits</text>
      <text x="160" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f0eef6">1.2K+</text>
      
      <!-- Stars -->
      <text x="250" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b8ba7">⭐ Stars</text>
      <text x="270" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f0eef6">40+</text>
      
      <!-- Followers -->
      <text x="350" y="20" font-family="'Segoe UI', sans-serif" font-size="11" fill="#8b8ba7">👥 Followers</text>
      <text x="380" y="40" text-anchor="middle" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" fill="#f0eef6">15+</text>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN ================= -->
  
  <!-- Code Snippet Card (Floating) -->
  <g class="float-card" transform="translate(560, 60)" filter="url(#softShadow)">
    <rect x="0" y="0" width="420" height="180" rx="12" fill="#1a1835" stroke="rgba(168,85,247,0.3)" stroke-width="1" />
    <!-- Window controls -->
    <circle cx="20" cy="20" r="5" fill="#ef4444" />
    <circle cx="35" cy="20" r="5" fill="#eab308" />
    <circle cx="50" cy="20" r="5" fill="#22c55e" />
    <text x="210" y="23" text-anchor="middle" font-family="'Consolas', monospace" font-size="12" fill="#8b8ba7">buildDreams.py</text>
    <path d="M 0,35 L 420,35" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
    
    <!-- Code content -->
    <text x="20" y="65" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#a855f7">def <tspan fill="#60a5fa">build_solutions</tspan>():</text>
    <text x="40" y="85" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#e2e8f0">return {</text>
    <text x="60" y="105" font-family="'Consolas', monospace" font-size="13" fill="#f59e0b">"role"<tspan fill="#e2e8f0">: </tspan><tspan fill="#a855f7">"Full-Stack Dev"</tspan><tspan fill="#e2e8f0">,</tspan></text>
    <text x="60" y="125" font-family="'Consolas', monospace" font-size="13" fill="#f59e0b">"stack"<tspan fill="#e2e8f0">: [</tspan><tspan fill="#a855f7">"Django"</tspan><tspan fill="#e2e8f0">, </tspan><tspan fill="#a855f7">"React"</tspan><tspan fill="#e2e8f0">],</tspan></text>
    <text x="60" y="145" font-family="'Consolas', monospace" font-size="13" fill="#f59e0b">"motto"<tspan fill="#e2e8f0">: </tspan><tspan fill="#a855f7">"Ship it!"</tspan></text>
    <text x="40" y="165" font-family="'Consolas', monospace" font-size="13" font-weight="bold" fill="#e2e8f0">}</text>
  </g>

  <!-- Custom Image / Illustration from User -->
  <!-- We embed the provided image on the bottom right and add a subtle drop shadow to ground it -->
  <g transform="translate(620, 260)" filter="url(#softShadow)">
    <image x="0" y="0" width="450" height="420" preserveAspectRatio="xMidYMid meet" href="converted-image.png" />
  </g>

  <!-- Bottom Quote -->
  <text x="1050" y="680" text-anchor="end" font-family="'Consolas', monospace" font-size="12" font-style="italic" fill="#8b8ba7">
    "Code is my art, Logic is my superpower." 💖
  </text>
</svg>
