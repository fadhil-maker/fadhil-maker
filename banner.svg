<svg width="1280" height="740" viewBox="0 0 1280 740" fill="none" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&amp;family=Rajdhani:wght@500;700&amp;family=Fira+Code&amp;display=swap');
      .title-text { font-family: 'Orbitron', sans-serif; font-size: 60px; fill: #E0F2FE; font-weight: bold; }
      .role-text { font-family: 'Rajdhani', sans-serif; font-size: 32px; fill: #38BDF8; font-weight: bold; letter-spacing: 2px; }
      .mono-text { font-family: 'Fira+Code', monospace; font-size: 18px; fill: #94A3B8; }
      .highlight { fill: #00F0FF; }
      .skill-pill { font-family: 'Rajdhani', sans-serif; font-size: 20px; fill: #FFFFFF; font-weight: 600; text-anchor: middle; letter-spacing: 1px; }
    </style>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08101E" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(56, 189, 248, 0.1)" />
      <stop offset="100%" stop-color="rgba(14, 165, 233, 0.02)" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="740" rx="20" fill="url(#bgGrad)" stroke="#0F172A" stroke-width="4"/>

  <!-- Animated Grid Background -->
  <g opacity="0.1" stroke="#38BDF8" stroke-width="1">
    <path d="M0 100 H1280 M0 200 H1280 M0 300 H1280 M0 400 H1280 M0 500 H1280 M0 600 H1280 M0 700 H1280" />
    <path d="M100 0 V740 M200 0 V740 M300 0 V740 M400 0 V740 M500 0 V740 M600 0 V740 M700 0 V740 M800 0 V740 M900 0 V740 M1000 0 V740 M1100 0 V740 M1200 0 V740">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="4s" repeatCount="indefinite" />
    </path>
  </g>

  <!-- IMPORTANT: AVATAR IMAGE CODE GOES HERE -->
  <!-- Only replace the data:image... string inside the quotes! -->
  <image x="750" y="50" width="500" height="640" xlink:href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNkYAAAAAYAAjCB0C8AAAAASUVORK5CYII=" opacity="0">
    <animate attributeName="opacity" from="0" to="0.8" dur="2s" begin="0.5s" fill="freeze" />
  </image>

  <!-- Left Glass Panel Slide-in -->
  <g transform="translate(-800, 0)">
    <animateTransform attributeName="transform" type="translate" from="-800, 0" to="0, 0" dur="1.2s" begin="0s" fill="freeze" calcMode="spline" keySplines="0.1 0.8 0.2 1" />
    
    <rect x="50" y="50" width="700" height="640" rx="15" fill="url(#glassGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" />
    
    <!-- Title Section -->
    <text x="100" y="150" class="title-text">MUHAMMED FADHIL</text>
    <rect x="100" y="180" width="100" height="4" fill="#00F0FF" filter="url(#glow)">
      <animate attributeName="width" from="0" to="400" dur="1s" begin="1.5s" fill="freeze" calcMode="spline" keySplines="0.2 0 0.2 1" />
    </rect>

    <!-- Role Section -->
    <text x="100" y="240" class="role-text">FULL-STACK DEVELOPER</text>
    <text x="100" y="280" class="role-text" fill="#0EA5E9">PYTHON / DJANGO SPECIALIST</text>

    <!-- Tech Stack Hexagons -->
    <g transform="translate(100, 350)">
      <!-- Hex 1 -->
      <path d="M25 0 L75 0 L100 43.3 L75 86.6 L25 86.6 L0 43.3 Z" fill="rgba(2, 132, 199, 0.2)" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
      <text x="50" y="50" class="skill-pill">PY</text>
      <!-- Hex 2 -->
      <path d="M135 0 L185 0 L210 43.3 L185 86.6 L135 86.6 L110 43.3 Z" fill="rgba(2, 132, 199, 0.2)" stroke="#38BDF8" stroke-width="2"/>
      <text x="160" y="50" class="skill-pill">DJ</text>
      <!-- Hex 3 -->
      <path d="M245 0 L295 0 L320 43.3 L295 86.6 L245 86.6 L220 43.3 Z" fill="rgba(2, 132, 199, 0.2)" stroke="#00F0FF" stroke-width="2"/>
      <text x="270" y="50" class="skill-pill">JS</text>
      <!-- Hex 4 -->
      <path d="M80 95 L130 95 L155 138.3 L130 181.6 L80 181.6 L55 138.3 Z" fill="rgba(2, 132, 199, 0.2)" stroke="#38BDF8" stroke-width="2"/>
      <text x="105" y="145" class="skill-pill">VPS</text>
      <!-- Hex 5 -->
      <path d="M190 95 L240 95 L265 138.3 L240 181.6 L190 181.6 L165 138.3 Z" fill="rgba(2, 132, 199, 0.2)" stroke="#00F0FF" stroke-width="2" filter="url(#glow)"/>
      <text x="215" y="145" class="skill-pill">SQL</text>
    </g>

    <!-- Server Status Code Block -->
    <g transform="translate(100, 560)">
      <text class="mono-text" y="0">> System.init()</text>
      <text class="mono-text" y="25">> Architecture: <tspan class="highlight">Decoupled</tspan></text>
      <text class="mono-text" y="50">> Deployment: <tspan class="highlight">Nginx / Cloudflare</tspan></text>
      <text class="mono-text" y="75">> Status: <tspan class="highlight">ONLINE &amp; SCALING</tspan></text>
      <rect x="220" y="60" width="10" height="20" fill="#00F0FF">
        <animate attributeName="opacity" values="0;1;0" dur="1s" repeatCount="indefinite" />
      </rect>
    </g>
  </g>

  <!-- Ambient Light Pulses -->
  <circle cx="1200" cy="100" r="80" fill="#00F0FF" opacity="0.1" filter="url(#glow)">
    <animate attributeName="r" values="80; 100; 80" dur="4s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.1; 0.2; 0.1" dur="4s" repeatCount="indefinite" />
  </circle>
</svg>
