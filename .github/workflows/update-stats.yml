name: Update GitHub Stats SVGs

on:
  schedule:
    - cron: '0 0 * * *' # Run at 00:00 UTC every day
  workflow_dispatch: # Allow manual triggering

permissions:
  contents: write
  
jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: Fetch Stats and Generate SVGs
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_PAT: ${{ secrets.GH_PAT }}
      run: |
        # Use PAT if available (for graphql private contributions), else use default token
        if [ -n "$GH_PAT" ]; then
          export GITHUB_TOKEN="$GH_PAT"
        fi
        python fetch_and_update.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add stats.svg langs.svg trophies.svg
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automated update: GitHub Profile Stats" && git push)
